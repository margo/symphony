# yaml-language-server: $schema=https://goreleaser.com
version: 2

project_name: margo-symphony-api

before:
  hooks:
    # Download Go dependencies.
    - sh -c "cd api && go mod download"

    # Build native Rust provider binding.
    - sh -c "cd api/pkg/apis/v1alpha1/providers/target/rust && cargo build --release"

    # Clean up any leftover sub-module configs from previous tracking runs.
    - sh -c "rm -f api/pkg/apis/v1alpha1/providers/target/rust/go.mod api/pkg/apis/v1alpha1/providers/target/rust/go.sum"
    
    # Decodes a 100% verified struct mockup with correct receiver spelling for local compilation.
    - sh -c "echo '' | base64 -d > api/pkg/apis/v1alpha1/providers/target/rust/provider.go"

builds:
  # Standalone Linux binaries for AMD64 and ARM64.
  - id: symphony-api-linux
    dir: ./api
    main: .
    binary: symphony-api

    # Lifecycle hook to destroy the placeholder immediately after binary compilation ends
    hooks:
      post:
        - sh -c "rm -f ./pkg/apis/v1alpha1/providers/target/rust/provider.go"

    flags:
      - -trimpath

    ldflags:
      - >-
        -X main.build={{.Version}}
        -X main.commit={{.Commit}}
        -X main.date={{.CommitDate}}

    env:
      - CGO_ENABLED=0

    goos:
      - linux

    goarch:
      - amd64
      - arm64

dockers_v2:
  - id: margo-symphony-api

    images:
      - "ghcr.io/margo/margo-symphony-api"

    dockerfile: ./api/Dockerfile

    # Publish a multi-architecture image.
    platforms:
      - linux/amd64
      - linux/arm64

    flags:
      - "--network=host"

    build_args:
      VERSION: "{{.Version}}"
      DATE: "{{.CommitDate}}"
      COMMIT: "{{.Commit}}"

    labels:
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.description: "Margo Symphony API. A reference implementation."
      org.opencontainers.image.source: "{{.GitURL}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.created: "{{.CommitDate}}"

    extra_files:
      - api/
      - coa/
      - packages/

report_sizes: true

archives:
  - id: symphony-api-archive

    ids:
      - symphony-api-linux

    formats:
      - tar.gz

    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

    wrap_in_directory: symphony-api

    files:
      - LICENSE
      
      - src: api/symphony-api-margo.json
        dst: symphony-api-margo.json

checksum:
  name_template: "{{.ProjectName}}_checksums.txt"

changelog:
  use: github-native

release:
  make_latest: true

  header: |
    ## This release targets the Margo spec version: {{.Env.MARGO_SPEC_VERSION}}, which can be tracked here: https://github.com

  footer: |
    **Full Changelog**: https://github.com{{ .PreviousTag }}...{{ .Tag }}

  github:
    owner: margo
    name: symphony

  disable: false
