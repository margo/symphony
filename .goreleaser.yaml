# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: margo-symphony-api

before:
  hooks:
    # Download Go dependencies.
    - sh -c "cd api && go mod download"

    # Remove any Rust build output left on the host. The Rust extension is
    # compiled inside the Docker image, so host output only bloats the build
    # context and fills the disk.
    - sh -c "rm -rf api/pkg/apis/v1alpha1/providers/target/rust/target"

    # Remove a stale provider.go stub left in the source tree by earlier runs.
    # It clashes with rust.go in the Docker build (CGO enabled). The stub is now
    # only injected via -overlay. Skipped if the file is tracked in git.
    - sh -c "f=api/pkg/apis/v1alpha1/providers/target/rust/provider.go; git ls-files --error-unmatch $f >/dev/null 2>&1 || rm -f $f"

    # Remove leftover sub-module configs from previous runs.
    - sh -c "rm -f api/pkg/apis/v1alpha1/providers/target/rust/go.mod api/pkg/apis/v1alpha1/providers/target/rust/go.sum"

    # Write a CGO-free stub of the Rust provider into /tmp (NOT into the source
    # tree or dist/, which GoReleaser requires to stay empty during hooks). The Go build swaps it in with -overlay, so provider.go in git is
    # never overwritten or deleted.
    - sh -c "mkdir -p /tmp/symphony-rust-overlay && echo '' | base64 -d > /tmp/symphony-rust-overlay/rust_provider_stub.go"

    # Overlay map: key is relative to the build dir (./api), value is absolute.
    - |
      sh -c "printf '%s' '{\"Replace\":{\"pkg/apis/v1alpha1/providers/target/rust/provider.go\":\"/tmp/symphony-rust-overlay/rust_provider_stub.go\"}}' > /tmp/symphony-rust-overlay/rust_overlay.json"

builds:
  # Standalone Linux binaries for AMD64 and ARM64 (used for the tar.gz archives).
  - id: symphony-api-linux
    dir: ./api
    main: .
    binary: symphony-api

    flags:
      - -trimpath
      - -overlay=/tmp/symphony-rust-overlay/rust_overlay.json

    ldflags:
      - >-
        -X main.build={{.Version}}
        -X main.commit={{.Commit}}
        -X main.date={{.CommitDate}}

    env:
      - CGO_ENABLED=0

    goos:
      - linux

    goarch:
      - amd64
      - arm64

dockers_v2:
  - id: margo-symphony-api

    images:
      - "ghcr.io/margo/margo-symphony-api"

    dockerfile: ./api/Dockerfile

    # Multi-architecture image (needs docker buildx + QEMU binfmt).
    platforms:
      - linux/amd64
      - linux/arm64

    flags:
      - "--network=host"

    build_args:
      VERSION: "{{.Version}}"
      DATE: "{{.CommitDate}}"
      COMMIT: "{{.Commit}}"

    labels:
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.description: "Margo Symphony API. A reference implementation."
      org.opencontainers.image.source: "{{.GitURL}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.created: "{{.CommitDate}}"

    # The Dockerfile compiles everything from source, so it needs these trees.
    extra_files:
      - api/
      - coa/
      - packages/

report_sizes: true

archives:
  - id: symphony-api-archive

    ids:
      - symphony-api-linux

    formats:
      - tar.gz

    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

    wrap_in_directory: symphony-api

    files:
      - LICENSE

      - src: api/symphony-api-margo.json
        dst: symphony-api-margo.json

checksum:
  name_template: "{{.ProjectName}}_checksums.txt"

changelog:
  use: github-native

release:
  make_latest: true

  header: |
    ## This release targets the Margo spec version: {{ envOrDefault "MARGO_SPEC_VERSION" "latest" }}, which can be tracked here, https://github.com/margo/specification .

  footer: |
    **Full Changelog**: https://github.com/margo/symphony/compare/{{ .PreviousTag }}...{{ .Tag }}

  github:
    owner: margo
    name: symphony

  disable: false