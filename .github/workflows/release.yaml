name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04

    # Rust cross-compilation environment variables
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout Symphony
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolves Go version directly from api/go.mod
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
          cache: true
          cache-dependency-path: api/go.sum

      # Install Rust toolchain and AMD64/ARM64 targets
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      # Configure multi-arch apt repositories and install dependencies
      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          
          # Ubuntu 24.04 (deb822) requires ports.ubuntu.com for arm64 packages
          sudo sed -i 's/Architectures: .*/Architectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo tee /etc/apt/sources.list.d/arm64.sources <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main restricted universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            gcc-x86-64-linux-gnu \
            g++-x86-64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            make \
            pkg-config \
            libssl-dev \
            libssl-dev:arm64 \
            protobuf-compiler

      # Configure Cargo linker and archiver for both architectures
      - name: Configure Rust cross-compilation
        run: |
          mkdir -p "$HOME/.cargo"

          cat >> "$HOME/.cargo/config.toml" <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          ar = "aarch64-linux-gnu-ar"

          [target.x86_64-unknown-linux-gnu]
          linker = "x86_64-linux-gnu-gcc"
          ar = "x86_64-linux-gnu-ar"
          EOF

      # Verify compilers before running GoReleaser
      - name: Verify build toolchains
        run: |
          go version
          cargo --version
          rustc --version
          x86_64-linux-gnu-gcc --version
          aarch64-linux-gnu-gcc --version
          rustup target list --installed

      # Robust extraction of MARGO_SPEC_VERSION using python YAML parser
      - name: Extract Margo spec version from sandbox
        run: |
          git clone --depth 1 \
            https://github.com/margo/sandbox.git \
            /tmp/margo-sandbox

          SPEC_FILE="/tmp/margo-sandbox/standard/snapshot.spec.yaml"
          if [ ! -f "$SPEC_FILE" ]; then
            echo "Error: $SPEC_FILE not found."
            exit 1
          fi

          # Parse YAML and strip quotes/whitespace
          MARGO_SPEC_VERSION=$(python3 -c "
          import yaml
          with open('$SPEC_FILE') as f:
              doc = yaml.safe_load(f)
              # Check top-level 'version' or nested spec version
              version = doc.get('version') or doc.get('spec', {}).get('version', '')
              print(version)
          " | tr -d ' "\r\n')

          if [ -z "${MARGO_SPEC_VERSION}" ]; then
            echo "Failed to extract MARGO_SPEC_VERSION"
            exit 1
          fi

          echo "MARGO_SPEC_VERSION=${MARGO_SPEC_VERSION}" >> "$GITHUB_ENV"
          echo "Margo spec version: ${MARGO_SPEC_VERSION}"

      # Enable QEMU for multi-platform container execution
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # Buildx is required for multi-architecture Docker images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Buildx
        run: |
          docker buildx inspect --bootstrap

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Validate GoReleaser configuration before publishing
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Build AMD64/ARM64 binaries, archives and container images,
      # then publish the GitHub release.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARGO_SPEC_VERSION: ${{ env.MARGO_SPEC_VERSION }}
