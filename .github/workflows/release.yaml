name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Symphony
        uses: actions/checkout@v4
        with:
          # Full history is required by GoReleaser for changelog generation
          # and release metadata.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
          cache-dependency-path: api/go.sum

      # Symphony standalone binary requires the Rust provider binding.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            make \
            pkg-config \
            libssl-dev \
            protobuf-compiler

      # Symphony does not contain standard/snapshot.spec.yaml.
      # Clone the Margo sandbox repository and extract the current
      # Margo specification version from its snapshot.
      - name: Extract Margo spec version from sandbox
        run: |
          git clone --depth 1 https://github.com/margo/sandbox.git /tmp/margo-sandbox

          MARGO_SPEC_VERSION=$(
            grep -A 0 '  version:' \
              /tmp/margo-sandbox/standard/snapshot.spec.yaml \
              | tail -1 \
              | awk '{print $2}'
          )

          if [ -z "${MARGO_SPEC_VERSION}" ]; then
            echo "Failed to extract MARGO_SPEC_VERSION from sandbox snapshot.spec.yaml"
            exit 1
          fi

          echo "MARGO_SPEC_VERSION=${MARGO_SPEC_VERSION}" >> "$GITHUB_ENV"
          echo "Margo spec version: ${MARGO_SPEC_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable multi-arch builds
        run: |
          docker buildx create --name=goreleaser --use
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Builds the Symphony binary, multi-architecture container image,
      # release archives/checksums, and generates the GitHub release.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARGO_SPEC_VERSION: ${{ env.MARGO_SPEC_VERSION }}
