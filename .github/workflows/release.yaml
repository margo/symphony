name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Symphony
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolves Go version directly from api/go.mod
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
          cache: true
          cache-dependency-path: api/go.sum

      - name: Verify Go toolchain
        run: go version

      # The spec version is the OpenAPI info.version field of the sandbox spec
      - name: Extract Margo spec version from sandbox
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml || true

          git clone --depth 1 \
            https://github.com/margo/sandbox.git \
            /tmp/margo-sandbox

          SPEC_FILE="/tmp/margo-sandbox/standard/snapshot.spec.yaml"
          if [ ! -f "$SPEC_FILE" ]; then
            echo "Error: $SPEC_FILE not found."
            exit 1
          fi

          MARGO_SPEC_VERSION=$(python3 - "$SPEC_FILE" <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open(sys.argv[1]))
          print(doc.get('info', {}).get('version', ''))
          PY
          )
          MARGO_SPEC_VERSION=$(printf '%s' "$MARGO_SPEC_VERSION" | tr -d ' "\r\n')

          if [ -z "${MARGO_SPEC_VERSION}" ]; then
            echo "Failed to extract MARGO_SPEC_VERSION"
            exit 1
          fi

          echo "MARGO_SPEC_VERSION=${MARGO_SPEC_VERSION}" >> "$GITHUB_ENV"
          echo "Margo spec version: ${MARGO_SPEC_VERSION}"

      # Enable QEMU for multi-platform container execution
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # Buildx is required for multi-architecture Docker images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Buildx
        run: |
          docker buildx inspect --bootstrap

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Validate GoReleaser configuration before publishing
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Build AMD64/ARM64 binaries, archives and container images,
      # then publish the GitHub release. The Rust extension is compiled
      # inside the Dockerfile, so no host Rust toolchain is needed.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARGO_SPEC_VERSION: ${{ env.MARGO_SPEC_VERSION }}